# Runs bin/qa.sh on every push and pull request: PHP syntax, the homepage copy
# registry test, the design audit at 1440 and 375, and the internal link check,
# against a throwaway WordPress Playground with this theme mounted.
#
# The theme must be checked out into a folder named CCS: the audit harness is
# served from /wp-content/themes/CCS/.
name: QA

# Only when started by hand (GitHub > Actions > QA > Run workflow). It used
# to run on every push to main, and failed about one time in six because the
# throwaway site had not finished starting, not because of the theme (client,
# 23 Nov 2026: "it keeps breaking", then "Yes, switch it off"). The same
# checks run locally with bin/qa.sh.
on:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: CCS

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install zsh and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y zsh imagemagick

      - name: Start WordPress Playground with the theme mounted
        working-directory: CCS
        run: |
          npx --yes @wp-playground/cli@latest server --auto-mount="$PWD" --port=9401 > "$RUNNER_TEMP/playground.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:9401/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/playground.log"
          exit 1

      # The first requests to a new Playground get a half-set-up site (default
      # title, no front page yet): the theme builds its pages, services and
      # menus over the first few requests. The first run on GitHub audited the
      # homepage in that window and found no h1. Wait until the pages exist and
      # the homepage has its heading, then load an admin request once so the
      # theme's one-time content updates (inc/content-updates.php, admin_init)
      # are applied before anything is measured.
      - name: Wait for the theme to finish setting up
        run: |
          B=http://127.0.0.1:9401
          for i in $(seq 1 48); do
            pages=$(curl -s -m 30 "$B/wp-json/wp/v2/pages?per_page=100&_fields=slug" | grep -o '"slug"' | wc -l)
            h1=$(curl -s -m 30 "$B/" | grep -c '<h1' || true)
            echo "try $i: $pages pages, homepage h1 x$h1"
            if [ "$pages" -ge 25 ] && [ "$h1" -ge 1 ]; then
              curl -s -m 60 -o /dev/null "$B/wp-admin/admin-ajax.php?action=ccs_warm_up" || true
              curl -s -m 30 -o /dev/null "$B/"
              exit 0
            fi
            sleep 5
          done
          echo "The site did not finish setting up"
          cat "$RUNNER_TEMP/playground.log"
          exit 1

      - name: Run QA
        working-directory: CCS
        env:
          CCS_BASE: http://127.0.0.1:9401
          CHROME: google-chrome
        run: zsh bin/qa.sh
